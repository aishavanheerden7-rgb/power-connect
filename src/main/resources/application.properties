spring.application.name=powerconnect
server.port=8088

# MySQL connection (values can be overridden by environment variables on the server)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/powerconnect}
spring.datasource.username=${DB_USER:student}
spring.datasource.password=${DB_PASSWORD:student123}

# The tables are created by database/schema.sql, so Hibernate must not change them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Show the message from ResponseStatusException in error replies (e.g. "Wrong email or password")
server.error.include-message=always

# Behind nginx (the website at /api/...): trust its X-Forwarded-* headers, so links that the API
# makes itself (e.g. Swagger UI) include the /api prefix and https
server.forward-headers-strategy=framework
